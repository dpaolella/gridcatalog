[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opengrid-datahub"
version = "1.0.0"
description = "Python SDK for the OpenGrid Data Hub: search grid-modelling datasets and read them where they live."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenGrid" }]
keywords = ["energy", "power-systems", "grid", "catalog", "datasets", "dcat"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

# The base install is a search client and nothing more. A user who wants to
# find datasets should not be made to install a numerical stack, and a user who
# wants to read a Zarr is told which extra to add rather than getting an
# ImportError from three frames down.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
xarray = ["xarray>=2024.1", "zarr>=2.17", "fsspec>=2024.2", "s3fs>=2024.2"]
netcdf = ["xarray>=2024.1", "netCDF4>=1.6"]
pandas = ["pandas>=2.2", "pyarrow>=15.0"]
geo = ["geopandas>=1.0", "rioxarray>=0.15"]
all = ["opengrid-datahub[xarray,netcdf,pandas,geo]"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://opengrid.org"
Source = "https://github.com/dpaolella/gridcatalog"

[tool.setuptools]
packages = ["opengrid"]

[tool.ruff]
line-length = 100
target-version = "py312"
