# Alembic configuration.
#
# The database URL is NOT set here. It comes from DATAHUB_DATABASE_URL via
# ops/migrations/env.py, so that a migration cannot be run against a different
# database from the one the application is using — the failure mode where a
# migration "succeeded" and the app still sees the old schema.

[alembic]
script_location = ops/migrations
prepend_sys_path = .
version_path_separator = os
# Timestamped revision filenames sort chronologically in a directory listing,
# which is how a reviewer reads a migration history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# `exec` rather than `console_scripts`: ruff ships as a standalone binary and
# is not always installed with an entrypoint in the environment running alembic.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
