# Fly.io deployment for the catalog's MCP endpoint and REST API.
#
#   fly launch --no-deploy     # once, to create the app
#   fly deploy                 # thereafter
#
# The connector URL to hand a reader is then:
#
#   https://<app>.fly.dev/mcp
#
# Chosen over a free tier that sleeps, and the reason is the usage pattern
# rather than the price. Somebody who consults a catalog weekly meets a cold
# start every single time; a 30-second wake is long enough for an MCP client
# to give up, and "it did not work the first time" is what makes a tool feel
# improvised. A machine that stays up costs a few dollars a month and never
# does that.

app = "opengrid-datahub"
primary_region = "iad"

[build]
  dockerfile = "ops/Dockerfile.mcp"

[env]
  PORT = "8000"
  # Where the site's Connect page and the SDK should point. Set to this app's
  # own public URL once it has one.
  DATAHUB_API_URL = "https://opengrid-datahub.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  # Always on. `min_machines_running = 0` would scale to zero and wake in a
  # second or two, which is fine for a browser and marginal for an MCP client
  # that opens a stream and expects an answer.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    # The catalog is read-only and served from memory; the limit is about not
    # letting one client monopolise the machine rather than about capacity.
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/v1/health"

[[vm]]
  # The whole catalog is an in-memory rdflib graph plus a JSON index. 512 MB is
  # comfortable at the current size and is the number to revisit first when the
  # catalog grows past a few thousand records.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
