name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python -e ".[dev,opensearch,mcp,llm]"
      - name: Lint
        run: .venv/bin/ruff check services sdk tests
      - name: Format check
        run: .venv/bin/ruff format --check services sdk tests
      - name: Types
        # Enforcing. Seven not-yet-clean modules are named in pyproject.toml's
        # mypy overrides rather than the whole check being made advisory with
        # `|| true`, which reported a green tick for a check that could not fail.
        run: .venv/bin/mypy
      - name: Tests
        run: .venv/bin/pytest -q --cov=services --cov=sdk --cov-report=term-missing
      - name: Conformance suite
        run: .venv/bin/pytest -q tests/conformance -v

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: E2E — Playwright over the real stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          npm ci
          npm ci --prefix web
          npx playwright install --with-deps chromium
      - name: Seed a catalog
        # A real store with the fixture corpus in it. The suite drives the API
        # and the UI together, because both bugs it has caught so far were
        # disagreements between them that neither side's own tests could see.
        env:
          DATAHUB_GRAPH_STORE_PATH: var/e2e/graph.nq
          DATAHUB_SEARCH_STORE_PATH: var/e2e/index.json
          DATAHUB_DATABASE_URL: sqlite+pysqlite:///var/e2e/ops.sqlite3
        run: |
          mkdir -p var/e2e
          .venv/bin/datahub db upgrade
          .venv/bin/datahub graph bootstrap
          .venv/bin/datahub record load tests/fixtures/records
          .venv/bin/datahub semantic run
          .venv/bin/datahub links run
          .venv/bin/datahub index reindex
      - name: Build the UI
        run: npm run build --prefix web
      - name: Run
        env:
          DATAHUB_GRAPH_STORE_PATH: var/e2e/graph.nq
          DATAHUB_SEARCH_STORE_PATH: var/e2e/index.json
          DATAHUB_DATABASE_URL: sqlite+pysqlite:///var/e2e/ops.sqlite3
          DATAHUB_API_URL: http://127.0.0.1:8000
          E2E_BASE_URL: http://127.0.0.1:3210
          # This suite is not human traffic and must not be sized as though it
          # were: twelve tests over two workers make about seventy requests in
          # six seconds, all from 127.0.0.1 — the exact shape a rate limit
          # exists to catch. It went red at the old anonymous default of 60,
          # once the limiter stopped losing increments under concurrency and
          # started counting properly.
          #
          # Raised here rather than left to the product default, which is now
          # 300 and would fit. Tying the suite's health to a number chosen for
          # real readers means the next correct tightening of that number turns
          # e2e red for no product reason. Limiting stays *on*, so the
          # middleware is still in the path on every request this suite makes.
          DATAHUB_RATE_LIMIT_ANONYMOUS_PER_MIN: 10000
        run: |
          .venv/bin/python -m uvicorn datahub.api.app:app --port 8000 &
          npm start --prefix web -- -p 3210 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3210/ >/dev/null && break
            sleep 2
          done
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

      # The static build, on the catalog this job already seeded. It is here
      # rather than in its own job because the expensive part — a populated
      # store — is already paid for, and because the alternative is finding out
      # that the export broke when a deploy to Pages fails on main.
      - name: Export a snapshot and build the static site
        env:
          DATAHUB_GRAPH_STORE_PATH: var/e2e/graph.nq
          DATAHUB_SEARCH_STORE_PATH: var/e2e/index.json
          DATAHUB_DATABASE_URL: sqlite+pysqlite:///var/e2e/ops.sqlite3
        run: |
          .venv/bin/pytest -q tests/snapshot
          .venv/bin/datahub snapshot export var/e2e/snapshot
          DATAHUB_SNAPSHOT="$PWD/var/e2e/snapshot" \
            NEXT_PUBLIC_BASE_PATH=/gridcatalog \
            npm run build --prefix web
          # The three things a Pages deploy needs and a passing build does not
          # guarantee: no Jekyll, a real 404 document, and no record whose
          # existence is allow-listed.
          test -f web/out/.nojekyll
          test -f web/out/404.html
          test ! -e web/out/datasets/utility-load-shapes-allowlisted
          # Here as well as in the Pages workflow, so the run that crosses the
          # line is the one that added the records rather than the deploy.
          ops/check-page-weight.sh web/out/datasets/index.html

          mkdir -p var/preview
          cp -r web/out var/preview/gridcatalog
          {
            echo "### Static site preview"
            echo
            echo "Download **static-site-${GITHUB_SHA}** from this run's Artifacts, then:"
            echo
            echo '```'
            echo "unzip static-site-${GITHUB_SHA}.zip -d preview"
            echo "cd preview && python3 -m http.server 8000"
            echo '```'
            echo
            echo "Open <http://localhost:8000/gridcatalog/>. The trailing path matters:"
            echo "this build sets a basePath of \`/gridcatalog\`, so served at the root"
            echo "every asset 404s."
          } >> "$GITHUB_STEP_SUMMARY"

      # A downloadable copy of exactly what a Pages deploy would publish.
      #
      # Pages serves one site per repository, fed from the default branch, so a
      # branch cannot be previewed at a URL without taking over the live one.
      # This is the way to look at a branch's site before deciding to publish
      # it, and it is the *same bytes*: the build above is the deploy build,
      # basePath and all, not a second export made for looking at.
      #
      # Nested under `gridcatalog/` on purpose. That build sets
      # NEXT_PUBLIC_BASE_PATH=/gridcatalog, so every asset URL is an absolute
      # `/gridcatalog/_next/...`. Unzipped flat and opened over `file://`, or
      # served at the root of a local server, the HTML loads and every
      # stylesheet, font and link 404s — which reads as "the branch broke the
      # site" rather than "you served it at the wrong path". Nesting makes the
      # obvious thing the right thing.
      - name: Keep the built site where it can be looked at
        uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: var/preview
          # Long enough to decide something, short enough that a year of CI
          # runs does not sit in storage. A preview nobody opened in a
          # fortnight is one nobody was going to.
          retention-days: 14

  integration:
    name: Integration — Fuseki, OpenSearch, Postgres
    runs-on: ubuntu-latest
    services:
      fuseki:
        image: stain/jena-fuseki:5.1.0
        env:
          ADMIN_PASSWORD: admin
          FUSEKI_DATASET_1: datahub
        ports: ["3030:3030"]
      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          # Plugin-loading chatter gets printed into this job's log at teardown,
          # *after* the test output, which buries the thing anybody opening a
          # failed run came to read. `logger.level: WARN` cut three hundred
          # lines to eighty and left the shard-allocation warnings, which fire
          # once per index the suite creates and say nothing about anything.
          logger.level: ERROR
        ports: ["9200:9200"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: datahub
          POSTGRES_USER: datahub
          POSTGRES_DB: datahub
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATAHUB_GRAPH_BACKEND: fuseki
      DATAHUB_SEARCH_BACKEND: opensearch
      DATAHUB_FUSEKI_URL: http://localhost:3030
      DATAHUB_FUSEKI_USER: admin
      DATAHUB_FUSEKI_PASSWORD: admin
      DATAHUB_OPENSEARCH_URL: http://localhost:9200
      DATAHUB_DATABASE_URL: postgresql+psycopg://datahub:datahub@localhost:5432/datahub
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python -e ".[dev,opensearch,postgres,queue]"
      - name: Wait for services
        # This loop has never once succeeded. `curl -sf http://localhost:3030/$`
        # asks Fuseki for the literal path `/$`, which is a 404 — so the `&&`
        # never fired, the loop always burned its full 60 iterations, and the
        # job then spent three minutes waiting before running the tests against
        # whatever state the services happened to be in. A readiness check that
        # cannot pass is the same defect as the empty-selection check below: it
        # costs the time and buys the appearance of a check.
        #
        # It probes the endpoint the tests use rather than a liveness page. A
        # Fuseki that is up without the `datahub` dataset answers the second and
        # fails every graph assertion, and that difference is the whole point of
        # asking.
        run: |
          ready() {
            curl -sf http://localhost:9200 >/dev/null || return 1
            curl -sf -u admin:admin --data-urlencode 'query=ASK {}' \
              http://localhost:3030/datahub/query >/dev/null || return 1
          }
          for i in $(seq 1 60); do
            if ready; then
              echo "services ready after $((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Fuseki or OpenSearch never became ready. The integration" \
               "suite would have run against services that are not there."
          curl -sS http://localhost:9200 || true
          curl -sS -u admin:admin --data-urlencode 'query=ASK {}' \
            http://localhost:3030/datahub/query || true
          exit 1
      - name: Migrate
        run: .venv/bin/alembic -c ops/alembic.ini upgrade head
      - name: Refuse to pass on an empty selection
        # This job started three services, ran migrations, collected zero tests
        # and reported green — for as long as nothing in the tree carried the
        # `integration` marker. A check that cannot fail is worse than no check:
        # it costs the compute and buys the appearance of coverage.
        run: |
          collected=$(.venv/bin/pytest -m integration --collect-only -q 2>/dev/null \
            | grep -oE '^[0-9]+' | head -1)
          echo "integration tests collected: ${collected:-0}"
          if [ "${collected:-0}" -lt 1 ]; then
            echo "::error::No integration tests were collected. The services below" \
                 "would have been started for nothing and this job would have passed."
            exit 1
          fi

      - name: Parity and integration suites
        # `-rf` and a one-line traceback: a parity failure is "this backend
        # differs", and the assertion line says which. The full traceback adds
        # nothing and pushes the summary further from the end of the log.
        #
        # Also to a file, because the runner prints every service container's
        # log after the last step: on a failed run the summary is buried under
        # a hundred lines of Postgres and OpenSearch startup, where a log tail
        # never reaches it. The artefact is the copy you can actually read.
        run: |
          set -o pipefail
          .venv/bin/pytest -q -m integration --tb=line -rf 2>&1 | tee integration.log
      - name: Keep the result where it can be read
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: integration.log
