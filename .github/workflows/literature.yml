name: Literature scores

# How much energy research names each dataset (issue #58), refreshed as a pull
# request.
#
# Its own workflow rather than a step in `harvest.yml`, for two reasons. It is
# slow — about 600 metered requests — and a harvest should not wait on it. And
# the scores are *committed data* like `relevance-decisions.yaml`: measured on
# their own cadence, reviewed in a diff, and read by every later build without
# re-measuring. See ADR-0013 for why that shape rather than a call at build
# time.
#
# **OpenAlex is metered.** A request costs $0.001 against a daily allowance that
# resets at midnight UTC. Without a key this runs against the free budget and
# stops when it is spent, having written what it got; the next run continues
# where it left off. That is the whole reason `literature scan` is resumable and
# defaults to skipping records that already have a score.
#
# Set the `OPENALEX_API_KEY` secret to raise the allowance. It is optional and
# the workflow does not fail without it.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Stop after N datasets. Blank means as many as the budget allows."
        required: false
        default: ""
      rescan:
        description: "Re-measure datasets that already have a score."
        type: boolean
        required: false
        default: false
  schedule:
    # Monthly. A dataset's standing in the literature does not move week to
    # week, and each run costs real money against the allowance.
    - cron: "0 4 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: literature
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  scan:
    name: Score the catalog against OpenAlex
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Scan
        env:
          # Optional. Absent, the scan uses the free daily allowance and stops
          # when it is spent, which is a partial result rather than a failure.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          ARGS=""
          [ -n "${{ inputs.limit }}" ] && ARGS="--limit ${{ inputs.limit }}"
          [ "${{ inputs.rescan }}" = "true" ] && ARGS="$ARGS --rescan"
          .venv/bin/datahub literature scan \
            --mailto "opengrid-datahub@users.noreply.github.com" \
            $ARGS | tee var-scan.txt

      - name: What the scores would refuse
        # Reports only. Nothing is removed by this workflow: the point of the
        # pull request is that a person sees the list before it happens.
        id: review
        run: |
          .venv/bin/datahub literature review --json > review.json || true
          .venv/bin/datahub literature review | tee review.txt || true
          {
            echo 'refused<<EOF'
            head -40 review.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: literature/scores
          add-paths: data/literature-scores.yaml
          title: "Literature scores: refreshed"
          commit-message: |
            Refresh the literature scores

            How many papers in an energy field name each dataset, measured
            against OpenAlex. Written by `datahub literature scan`.
          body: |
            Automated refresh of `data/literature-scores.yaml` (issue #58).

            `works` is how many papers name the dataset; `energy_works` is how
            many of those are classified in OpenAlex's Energy or Engineering
            fields — a claim about what a paper is *about*, not a keyword
            match. Searching for energy *words* instead reports 123 hits for
            ArcticDEM, every one of them a glaciology paper containing "energy
            balance".

            **A dataset missing from the file is unmeasured, not unused.** The
            scan stops when the daily OpenAlex allowance is spent and the next
            run continues; nothing downstream reads an absent entry as a zero.

            ## What these scores would refuse

            Reported, not applied — no record is removed by this workflow.
            Refusal needs every signal to agree: no energy literature names it,
            **and** nothing records it being used, **and** it was admitted for
            the class of data it is rather than for its own subject. Each of
            those has a known failure mode on its own — NOAA HRRR scores 5
            because its forecasting papers are classified in Meteorology.

            ```
            ${{ steps.review.outputs.refused }}
            ```

            To act on it: `datahub literature review --apply`, which moves
            those records to `data/retracted/` so a wrong call is a revertible
            diff rather than an absence nobody can see.
          labels: literature
          delete-branch: false
