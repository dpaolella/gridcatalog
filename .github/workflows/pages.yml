name: Pages

# Publish the catalog as a static site.
#
# What gets published is a snapshot taken by driving the real API **with no
# credentials**, so the site carries exactly what an anonymous caller can see
# and cannot carry anything else. `tests/snapshot/` asserts that against the
# artefact itself, and this workflow runs it before the upload rather than
# after, because a static site cannot be un-published.

# Any push, filtered to the default branch by the `if` on the build job below
# rather than by a branch name here. Naming the branch would have to be right
# twice — once now, and again the day the default is renamed — and the failure
# when it is wrong is silent: the workflow simply never runs, and the site goes
# stale with nothing to show for it. A push to any other branch produces a
# skipped run, which costs nothing.
on:
  push:
  workflow_dispatch:

# Pages needs to write its own deployment; nothing here needs write access to
# the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is mid-flight: a
# half-uploaded site is a broken site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build the static site
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      DATAHUB_GRAPH_STORE_PATH: var/site/graph.nq
      DATAHUB_SEARCH_STORE_PATH: var/site/index.json
      DATAHUB_DATABASE_URL: sqlite+pysqlite:///var/site/ops.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          npm ci --prefix web

      - name: Build a catalog
        # Breadth from the seed inventory, depth from the golden set.
        #
        # The seed inventory alone is ~50 records at completeness level 1: real,
        # but with no schemas and nothing graded, so the site would show a
        # catalog of stubs and say nothing about what the system does. The
        # golden set is the curated level-3 half — every fact in it drawn from
        # the seed inventory or the dataset's own documentation — and four of
        # its records enrich seed entries that already exist rather than adding
        # new ones.
        #
        # Two golden-set records are excluded. They are synthetic fixtures that
        # exist to test the entitlement matrix, and a public catalog should list
        # datasets that exist. What they prove is proven by `tests/snapshot/`,
        # which does not need them to be published to do it.
        #
        # Unverified seed rows land in the draft graph and are never published.
        # That is the seed file's own instruction, enforced by the loader rather
        # than by this workflow.
        run: |
          mkdir -p var/site/curated
          cp tests/fixtures/records/*.jsonld var/site/curated/
          rm var/site/curated/caiso-nodal-lmp-restricted.jsonld \
             var/site/curated/utility-load-shapes-allowlisted.jsonld

          # The registry fixtures. Invented, and each says so in its own
          # description — invented richness attaches only to invented entities,
          # never to a real publisher's name (#85).
          # Only the reference model, which is also a `dcat:Dataset` and so is
          # something `record load` can write. The study, its assumption sets
          # and its run records are not datasets, and the loader refuses a
          # record with no `dcat:Dataset` node rather than inventing an
          # identity for it — correctly, and it exits non-zero, which would
          # take the build down. They land when #82 teaches the store about
          # non-dataset records.
          cp tests/fixtures/registry/cascade-reference-model.jsonld \
             tests/fixtures/registry/gb-osm-reference-model.jsonld \
             var/site/curated/

          .venv/bin/datahub db upgrade
          .venv/bin/datahub graph bootstrap
          .venv/bin/datahub seed load
          .venv/bin/datahub record load var/site/curated

          # Every record here is authored and committed, so the build reads
          # exactly what is in the repository. There is no discovery pass and
          # no network read: the two `load` commands above are the whole
          # corpus, and a checkout reproduces the published site byte for byte.

          # Order, and both halves of it are load-bearing in opposite
          # directions.
          #
          # `semantic run` writes grades to the computed graph, so it must come
          # BEFORE an index built from that graph — an index built first
          # captures the catalog ungraded, and every published record reads
          # "Not yet assessed".
          #
          # `links run` reads the *search index* rather than the graph, so it
          # must come AFTER one exists. Run before, it sees nothing and writes
          # no links at all: 0 instead of 104, and the shared-origin warnings
          # PRD §1 calls out as the differentiating feature silently absent.
          #
          # So: grade, index, link, index again. Reindex is idempotent and
          # takes seconds; the second pass is what carries the links into the
          # index that serves them.
          .venv/bin/datahub semantic run
          .venv/bin/datahub index reindex
          .venv/bin/datahub links run
          .venv/bin/datahub index reindex

      - name: Check what the exporter publishes
        # Before the export, not after. These tests are the reason it is safe
        # to point a public URL at this artefact at all.
        run: .venv/bin/pytest -q tests/snapshot

      - name: Export the snapshot
        run: .venv/bin/datahub snapshot export var/site/snapshot

      - name: Publish the catalog as a fetched file, not page weight
        # `index.json` is the whole search payload the browser filters over.
        # It used to be serialised into `index.html` as a prop, which is what
        # took the landing page to 3,122 KB against a 2,048 KB limit once the
        # catalog grew past a few hundred records. Copied into `web/public/` it ships as a
        # separate, separately-cached asset that the page fetches on mount, and
        # the page stops growing with the catalog.
        run: |
          cp var/site/snapshot/index.json web/public/catalog.json

          # The reference model's bytes, served from the site that registers it.
          # This is the custody rule made literal: an object registered with the
          # Hub is one the Hub promises will not move, so the Hub holds it —
          # and a viewer that fetched it from somewhere else would be reading a
          # copy nobody promised anything about. Same origin also means the
          # static site needs no CORS grant from anybody.
          #
          # Which files, per model, is a size decision rather than a
          # convention. Cascade has no route geometry and its whole document is
          # 281 KB, so the viewer reads the model itself. The GB model carries a
          # surveyed corridor per circuit and is 2.9 MB — a download, not a page
          # asset — so the site serves its display-resolution copy and the
          # record's distribution still points at the full one.
          mkdir -p web/public/reference-models/cascade-interconnect
          cp data/reference-models/cascade-interconnect/system.json \
             data/reference-models/cascade-interconnect/basemap.json \
             web/public/reference-models/cascade-interconnect/
          mkdir -p web/public/reference-models/gb-osm
          cp data/reference-models/gb-osm/system.view.json \
             data/reference-models/gb-osm/basemap.json \
             web/public/reference-models/gb-osm/
          printf 'catalog.json: %s KB\n' \
            "$(( ($(wc -c < web/public/catalog.json) + 1023) / 1024 ))" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the site
        env:
          DATAHUB_SNAPSHOT: ${{ github.workspace }}/var/site/snapshot
          # A project site lives under the repository name; a user or org site
          # (`<name>.github.io`) and a custom domain live at the root. Setting
          # this wrong is the classic Pages failure: the HTML loads and every
          # stylesheet, font and link 404s.
          NEXT_PUBLIC_BASE_PATH: ${{ endsWith(github.repository, format('{0}.github.io', github.repository_owner)) && '' || format('/{0}', github.event.repository.name) }}
          # Where a reader's own MCP client and SDK should point. The static
          # site has no backend of its own, so this is the address of a live
          # deployment if there is one, and the local quickstart if there is
          # not.
          DATAHUB_API_URL: ${{ vars.DATAHUB_PUBLIC_API_URL || 'http://localhost:8000' }}
        run: npm run build --prefix web

      # `web/public/.nojekyll` is copied into the export and is what stops
      # Pages running the artefact through Jekyll — which drops every path
      # beginning with an underscore, including `_next/`, which is all the
      # JavaScript and every font. It is an empty file with no way to explain
      # itself, so it is explained here and in docs/hosting.md.
      - name: Check the export is Pages-shaped
        run: test -f web/out/.nojekyll && test -f web/out/404.html

      # The static site's search runs in the browser over the whole catalog, so
      # the whole catalog is in the landing page. That is fine at this size and
      # will not be, and nothing enforced the limit until this step.
      - name: Check the landing page has not outgrown one file
        run: ops/check-page-weight.sh web/out/datasets/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
