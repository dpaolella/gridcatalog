name: Deploy MCP

# Ship the container that serves the MCP endpoint.
#
# Manual and on a push to the default branch, and it is a no-op until somebody
# has run `fly launch` once and put a deploy token in FLY_API_TOKEN — a
# repository with no such secret should not fail its default-branch pushes
# because of a deployment nobody has set up yet.

on:
  push:
    branches-ignore: []
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # Only the default branch, worked out rather than named — the same reason
    # pages.yml does it this way. Hardcoding a branch has to be right twice,
    # and when it is wrong the workflow silently never runs.
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4

      - name: Is this configured?
        id: configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "no FLY_API_TOKEN secret; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "See docs/mcp-deployment.md to set this up." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.configured.outputs.ready == 'true'

      - name: Deploy
        if: steps.configured.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # `--ha=false` keeps it to one machine. Two would be twice the bill for
        # a read-only catalog that fits in memory.
        run: flyctl deploy --remote-only --ha=false

      - name: Check the endpoint answers
        if: steps.configured.outputs.ready == 'true'
        # A deploy that reports success and serves a broken MCP endpoint is the
        # failure worth catching here: the protocol handshake is the thing a
        # reader's client does first, so it is the thing to check.
        run: |
          APP=$(grep -m1 '^app *=' fly.toml | cut -d'"' -f2)
          URL="https://${APP}.fly.dev/mcp/"
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -sS --max-time 20 \
              -H 'Accept: application/json, text/event-stream' \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              "$URL" || true)
            if echo "$BODY" | grep -q '"serverInfo"'; then
              echo "MCP endpoint answered: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "MCP endpoint did not answer at $URL" >&2
          exit 1
