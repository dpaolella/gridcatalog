# Relevance decisions for the harvest filter's third stage (PRD §7.2).
#
# The filter accepts on a strong keyword score, rejects on a weak one, and
# hands everything between to a classifier. This file *is* that classifier —
# see `services/harvest/filters/decisions.py` for why it is committed data
# rather than a runtime model call, and `docs/decisions/0013-relevance-decisions.md`
# for the decision record.
#
# Keys are harvest source ids: `<source>:<identifier>`, the same key the
# harvester is idempotent on. A dataset with no entry is undecided, not
# irrelevant — the filter accepts it and says so, so an uncovered record shows
# up as a gap rather than as a silent exclusion.
#
# ## The question each entry answers
#
# **Would a power-system or energy-system modeller plausibly use this dataset
# as a model input, or to site or permit infrastructure?**
#
# Not "is it energy-adjacent", and not "is it good data". The catalog's ten
# domains are the scope: network topology, generation fleet, load and demand,
# cost, renewable resource and weather, emerging technology, fuel and
# commodity, policy and regulation, and geospatial siting.
#
# Two lines are drawn deliberately, because they decide most of the file:
#
# * **Derived quantity, not raw sensor.** Land cover classes, elevation,
#   bathymetry and albedo are read directly by siting and resource work.
#   Radiance, reflectance and SAR backscatter are not: turning one into a
#   siting input is a processing project, and a catalog that lists them is
#   telling a modeller to go and do it.
# * **Operational, not research.** NOAA's space-weather forecast is what a
#   utility reads before a geomagnetic storm reaches its transformers. A
#   heliophysics mission archive is not, however closely related.
#
# Disagreeing with a call here means editing one line, and the diff says what
# changed and why. That is the whole point of the file.
#
# Decided by Claude over the AWS Registry of Open Data, 335 records — every
# entry the keyword stage could not settle on its own. Nobody has re-checked
# them by hand; `og:reviewState` still records how each record was published.

