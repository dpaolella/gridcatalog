# Publishers — a DRAFT for review (#70, unblocking #65 WP-1)
#
# **Nothing reads this file yet.** It is a proposal, extracted from the seed
# inventory so that a person can correct and extend it rather than compose one
# from nothing. Every entry is `reviewed: false` until somebody says otherwise.
#
# ## Where it came from
#
# The 131 rows of `seed-sources.yaml` carry an `access` URL each; 108 of them
# resolve to a host. Grouping by registrable domain gives 67 publisher
# candidates. It is **not** read from a `publisher` field — only 14 of 232
# records carry one, so the URL host is the signal that actually exists.
#
# Two adjustments were needed and both are judgement calls worth checking:
#
#   * A hosting platform is not a publisher. `github.com/PyPSA/...` is PyPSA,
#     not GitHub, so for github.com, GitLab, Zenodo, PyPI, figshare and the
#     rest the organisation is taken from the first path segment. Grouping
#     those by host would have filed ten unrelated projects under one target.
#   * Three candidates were dropped as not being data publishers at all: a
#     Nature article, a PyPI URL path, and Zenodo's `/records/` prefix.
#
# ## What this list is for
#
# #65's thesis is that the human input moves from "here are 131 datasets" to
# "here are ~40 publishers" — a list an order of magnitude smaller that changes
# far more slowly. This is the draft of that list. It came out at 67 rather
# than 40, and the `organisation` field is why: NREL appears four times
# (nrel.gov, openei.org, and two GitHub orgs), Copernicus three. Collapsing
# those is part of the review.
#
# ## The number that matters
#
# **5 of 67 candidates are indexed by any registered harvest source.** Measured
# from the other direction than #65's "9 of 91 datasets", and it says the same
# thing: every registered source is a research data repository, and the
# datasets in this catalog mostly live on a publisher's own site.
#
# ## Fields
#
#   name       The organisation. `null` where I was not confident — an inferred
#              publisher name is a claim about who stands behind a dataset, so
#              it is left blank rather than guessed from a domain.
#   host       Derived from a seed row's access URL. This one is a fact.
#   crawl      How to harvest it. **Always null here** — nobody has checked
#              whether these have an API, a DCAT feed, a sitemap or only HTML.
#              That is the next question, and it is per publisher.
#   organisation  Set where several entries are one body. Collapse on review.
#   covered_by_source  A registered harvest source already indexes this host,
#              so it is not a new crawl target — it is evidence that source has
#              never been run, which is #68.
#   reviewed   false everywhere. A person setting this true is the point.
#
# ## Known incompleteness
#
# 23 seed rows have no access URL, so they contributed no publisher. Most are
# commercial or restricted — Lazard, Wood Mackenzie, BNEF, ICE/Platts/Argus,
# NERC GADS, FERC CEII — and a crawler will never reach them. A few are open
# and simply lack a recorded URL: Open Power System Data, PyPSA-Earth weather
# cutouts, SciGRID, NREL ORBIT, GridPath RA Toolkit. **Those five are the
# clearest gap in this list** and are worth adding by hand.
#
# And this is only what the catalog already knows about. A publisher nobody has
# catalogued yet cannot appear here, which is exactly what extending the list
# is for.

