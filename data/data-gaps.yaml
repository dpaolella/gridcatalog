# OpenGrid Data Hub - the gap register
#
# A data requirement with no open supplier. PRD section 5 says that saying what
# does not exist is a feature, and the catalog had two ways to say it - a field
# nobody described (og:conceptGap, og:provenanceGap) and a dataset nobody can
# obtain (a reference-only record with an og:pointerRationale). Both attach to
# something the catalog already holds. This is the third case and the commonest:
# a thing a modeller needs where nothing open supplies it.
#
# These are NOT datasets. They carry no licence, no access path and no quality
# grade, they are served from /v1/gaps rather than /v1/datasets, and they are
# counted separately everywhere - a gap that leaked into a dataset count would
# be the catalog inventing a record for something that does not exist, which is
# the opposite of the point (#56).
#
# Source: Open Energy Data Inventory (Patricia Levi, Breakthrough Energy Grids,
# 2025), the `Opportunity analysis for open-source data` column of its Data
# Types sheet. Nineteen of its 105 rows carry a written finding; all nineteen
# are here, verbatim apart from whitespace.
#
# A gap claims something about the WHOLE open landscape, which is a far stronger
# claim than one about a single dataset and goes stale faster. Every entry
# carries its observer and the date it was observed, and a reader sees both.
# `review_after` is when somebody should check whether it is still true.

schema_version: "0.1.0"

gaps:

  - id: renewable-generation-targets
    title: Renewable Generation Targets
    domain: DD8
    category: High-level settings / Policy & renewable generation inputs
    needed_by: [capacityExpansion]
    kind: primary
    reason: >-
      Government programs and policies are a key input; comprehensive trackers exist, but do
      not clearly pull out information on how these policies need to be modeled, generally
      requiring an analyst with familiary with the local policies.
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: historical-demand-basic-scaling-factor
    title: Historical demand + basic scaling factor
    domain: DD4
    category: Energy Demand / Demand timeseries
    needed_by: [capacityExpansion, productionCost]
    kind: modeled
    reason: >-
      Historical demand is broadly available in developed countries, and variously available
      elsewhere. Simple scaling factors can be used to scale it up to represent demand
      growth, although this becomes meaningfully inaccurate when looking many years in the
      future.
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: demand-forecasts-weather-data-and-or-renewables-data-from-a-
    title: Demand forecasts + weather data and/or renewables data from a matched weather year
    domain: DD4
    category: Energy Demand / Demand timeseries
    needed_by: [reliabilityAssessment, acPowerFlow]
    kind: modeled
    reason: >-
      NREL dsgrid and DemandCast require significant programming skill and technical
      knowledge from the user -- they are not very accessible to resource-strapped planning
      teams, for example. Finalized data products generated by these, and more accessible
      versions of these tools that expose sectoral detail, weather impact, and spatial
      resolution would provide significant value
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: weather-data
    title: Weather data
    domain: DD4
    category: Energy Demand / Demand timeseries
    needed_by: [reliabilityAssessment]
    kind: modeled
    reason: >-
      Weather re-analysis datasets are available, but converting that data into demand
      impacts or renewable generation requires additional tooling and expertise. Access to
      weather-harmonized datasets for demand + generation remains a blocker in the industry.
      EPRI's Climate Readi initiative may address this somewhat, but it is not open-source
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: zonal-demand
    title: Zonal demand
    domain: DD4
    category: Energy Demand / Demand timeseries
    needed_by: [reliabilityAssessment, acPowerFlow]
    kind: modeled
    reason: >-
      Zonally-resolved demand, especially below the balancing-authority level, can be more
      challenging to come by, and depends on data shared by individual grid operators and
      utilities
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: nodal-demand
    title: Nodal demand
    domain: DD4
    category: Energy Demand / Demand timeseries
    needed_by: [acPowerFlow]
    kind: modeled
    reason: >-
      Nodal demand is very challenging to estimate, as end-use drivers may vary significatly
      by location. It requires significant data to estimate accurately, as well as
      significant technical skill
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: expected-demand-growth-rates-over-future-years-for-individua
    title: Expected demand growth rates over future years for individual sectors
    domain: DD4
    category: Energy Demand / Demand timeseries
    needed_by: [capacityExpansion]
    kind: modeled
    reason: >-
      Projections of differential sectoral growth must be found in the literature, e.g. the
      NREL Electrification Futures Study or other forward-looking studies.
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: technology-level-capacity-valuation-eg-elcc-possibly-shiftin
    title: Technology level Capacity Valuation (eg ELCC), possibly shifting by year
    domain: DD2
    category: Capacity & RA / Capacity valutions
    needed_by: [capacityExpansion]
    kind: modeled
    reason: >-
      Capacity accreditation is widely used for capacity expansion and investment planning,
      and has a major impact on results. It is highly dependent on the generation mix and
      demand profile modeled, so they are generally created bespoke for IRPs. However, there
      is a wide range in quality and what is available in an open-source fashion.
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: outage-probability-as-a-function-of-temperature-by-plant-typ
    title: Outage probability as a function of temperature by plant type
    domain: DD2
    category: Capacity & RA / Outage rates
    kind: primary
    reason: >-
      Outage probability is highly dependent on temperature; having this information is a
      huge upgrade over temerature-neutral probabilities
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: fixed-opex
    title: Fixed opex
    domain: DD2
    category: Existing Generation / All Generator Data
    needed_by: [capacityExpansion]
    kind: primary
    reason: >-
      More specific operational data is often difficult to find on a per-plant or per-unit
      basis. Average assumptions by class are often used, but assembling those defaults that
      are accurate for exisiting infrastructure (not based on new investments today) often
      relies on a scatter-shot mix of resources. There's room here for improvement.
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: heat-rate-mmbtu-mwh
    title: Heat rate (MMBTU/MWh)
    domain: DD2
    category: Existing Generation / Thermal Generator Data
    needed_by: [capacityExpansion, productionCost, reliabilityAssessment, acPowerFlow]
    kind: primary
    reason: >-
      More specific operational data is often difficult to find on a per-plant or per-unit
      basis. Average assumptions by class are often used, but assembling those defaults that
      are accurate for existing infrastructure — rather than based on new investments today
      — relies on a scatter-shot mix of resources. (The workbook records this row as "see
      note on operational data"; the note it points at is the one on fixed opex, reproduced
      here so the entry stands on its own.)
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: fuel-availability-constraints
    title: Fuel availability constraints
    domain: DD2
    category: Existing Generation / Thermal Generator Data
    needed_by: [productionCost, reliabilityAssessment]
    kind: primary
    reason: >-
      Fuel availability constraints can drive investment choices, due both to limited
      pipeline capacity constraining total feasible new investments in gas-fired generators,
      and to extreme events like winter storms causing reliability events that are
      exacerbated by limited supply during those events. Data on these constraints are not
      widely available, hindering analysis on possible reliability concerns
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: max-upward-ramp
    title: Max upward ramp
    domain: DD2
    category: Existing Generation / Thermal Generator Data
    needed_by: [capacityExpansion, productionCost, reliabilityAssessment]
    kind: primary
    reason: >-
      More specific operational data is often difficult to find on a per-plant or per-unit
      basis. Average assumptions by class are often used, but assembling those defaults that
      are accurate for existing infrastructure — rather than based on new investments today
      — relies on a scatter-shot mix of resources. (The workbook records this row as "see
      note on operational data"; the note it points at is the one on fixed opex, reproduced
      here so the entry stands on its own.)
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: charging-and-discharging-efficiency
    title: Charging and discharging efficiency
    domain: DD2
    category: Existing Generation / Storage asset operational constraints
    needed_by: [capacityExpansion, productionCost, reliabilityAssessment]
    kind: primary
    reason: >-
      More specific operational data is often difficult to find on a per-plant or per-unit
      basis. Average assumptions by class are often used, but assembling those defaults that
      are accurate for existing infrastructure — rather than based on new investments today
      — relies on a scatter-shot mix of resources. (The workbook records this row as "see
      note on operational data"; the note it points at is the one on fixed opex, reproduced
      here so the entry stands on its own.)
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: capex-mw
    title: Capex $/MW
    domain: DD9
    category: Investable assets / Investment costs
    needed_by: [capacityExpansion]
    kind: primary
    reason: >-
      New technologies may be poorly represented in existing datasets; there is room for
      more active centralized monitoring and collection of cost data that pops up in IRPs
      and other venues.
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: required-tx-upgrades-mw
    title: Required Tx upgrades ($/MW)
    domain: DD9
    category: Investable assets / Investment costs
    kind: primary
    reason: >-
      Tx upgrade costs can be a big driver of investment; good rough estimates could speed
      early stages of investment opporutnity analysis
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: total-build-limits-by-investment-year
    title: Total build limits (by investment year)
    domain: DD9
    category: Investable assets / Build Limits / Resource Potential
    needed_by: [capacityExpansion]
    kind: modeled
    reason: >-
      Resource potential and total build limits can require technical capability to
      determine from more easily accessible information on land use and resource quality.
      Build limits in particular are often a judgement call when they are based on expected
      speed of deployment rather than total capacity
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: maximum-contribution-mw-for-each-asset
    title: Maximum contribution (MW) for each asset
    domain: DD6
    category: Ancillary service demand / Build Limits / Resource Potential
    needed_by: [productionCost, reliabilityAssessment]
    kind: primary
    reason: >-
      Ancillary service definitions and needs vary significantly across systems. They can
      drive investment in certain resource classes, like battery storage. Standardized
      datasets are much sparser here and modeling typically draws from academic and grey
      literature, or from complete model datasets provided as starter kits for existing
      models
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31

  - id: line-flow-limits-reactance
    title: Line flow limits Reactance
    domain: DD1
    category: Transmission / Electrical flow representation
    reason: >-
      Including reactance introduces additional realism in that that power will flow across
      lines in proportion to their reactance. This can reveal additional network constraints
      and is important for understanding how loop flows and parallel paths affect flows
    observed_by: Open Energy Data Inventory (Levi, Breakthrough Energy Grids)
    observed: 2025
    review_after: 2026-12-31
